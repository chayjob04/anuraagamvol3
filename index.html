<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song Lyrics Finder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap');

  :root {
    --red: #e13c2e;
    --red-dark: #c22a1f;
    --black: #0d0d0d;
    --panel: #161616;
    --cream: #f2ede4;
    --muted: #b8b2a8;
    --border: #2c2c2c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Oswald', 'Segoe UI', sans-serif;
    background-color: var(--black);
    background-image: url('assets/red-bg.jpeg');
    background-repeat: repeat;
    background-size: 500px auto;
    background-position: top left;
    color: var(--cream);
    padding: 0 0 60px;
  }
  header.hero {
    background: rgba(13,13,13,0.40);
    backdrop-filter: blur(1px);
    padding: 50px 16px 6px;
    text-align: center;
    border-bottom: 5px solid var(--red);
    position: relative;
    overflow: visible;
  }
  header.hero img {
    max-width: 320px;
    width: 85%;
    height: auto;
    margin: -30px 0 0px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    position: relative;
    display: inline-block;
  }
  h1.tagline {
    font-family: 'Anton', sans-serif;
    letter-spacing: 2px;
    font-size: 1.5rem;
    margin: 6px 0 4px;
    color: var(--cream);
    text-transform: uppercase;
  }
  p.sub {
    text-align: center;
    color: var(--muted);
    margin: 0;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 0;
  }
  #searchBar {
    width: 100%;
    padding: 13px 16px;
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: rgba(22,22,22,0.9);
    color: var(--cream);
    outline: none;
    margin-bottom: 24px;
  }
  #searchBar::placeholder { color: var(--muted); }
  #searchBar:focus {
    border-color: var(--red);
  }
  h2.section-title {
    font-family: 'Anton', sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.7), 0 0 10px rgba(0,0,0,0.4);
    border-bottom: 2px solid var(--red-dark);
    padding-bottom: 8px;
    margin-top: 34px;
    font-size: 1.15rem;
  }
  ul.song-list {
    list-style: none;
    padding: 0;
    margin: 10px 0;
  }
  li.song-item {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 6px;
    background: rgba(10,10,10,0.82);
    margin-bottom: 4px;
    transition: background 0.15s ease, transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  li.song-item:active {
    background: rgba(225,60,46,0.35);
    transform: translateX(2px);
  }
  @media (hover: hover) {
    li.song-item:hover {
      background: rgba(225,60,46,0.35);
      transform: translateX(2px);
    }
  }
  .num {
    color: var(--red);
    font-weight: 600;
    min-width: 28px;
    font-size: 0.9rem;
  }
  a.song-link {
    color: var(--cream);
    text-decoration: none;
    font-size: 1.02rem;
    letter-spacing: 0.3px;
    flex: 1;
    -webkit-tap-highlight-color: transparent;
  }
  a.song-link:hover {
    color: #ffffff;
    text-decoration: underline;
    text-decoration-color: var(--red);
  }
  .no-results {
    text-align: center;
    color: var(--muted);
    margin-top: 30px;
    display: none;
  }
  footer.foot {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 50px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<header class="hero">
  <img src="assets/anuraagam-logo.png" alt="Anuraagam logo">
  <h1 class="tagline">Song Lyrics Finder</h1>
  <p class="sub">Search by number or name, then click a song to find its lyrics</p>
</header>

<div class="wrap">
  <input type="text" id="searchBar" placeholder="Search by song number or name...">

  <div id="songContainer">
    <h2 class="section-title">Karthik Songs</h2>
    <ul class="song-list" id="list-karthik"></ul>

    <h2 class="section-title">Harris Jayaraj Songs</h2>
    <ul class="song-list" id="list-harris"></ul>
  </div>

  <p class="no-results" id="noResults">No songs match your search.</p>

  <footer class="foot">Anuraagam — More Than A Song.</footer>
</div>

<script>
  const karthikSongs = [
    "Choododhe", "Ale ale", "Girlfriend", "Kannulabashalu", "Oka maru",
    "Choododhantunna", "Oru ghallukey", "Hoyna aata", "Arere arere", "O my friend",
    "Chilipiga", "Muthyala daraney", "Devatha", "Mila mila", "Yellipokey shamala",
    "Vaalu kalla vayyari", "Adiga", "Nijanga nenena", "Nilavadhamu", "Akasham badhalaina",
    "Hello rammante", "Ammaye sannaga", "Yedutanilichindi"
  ];

  const harrisSongs = [
    "Rooba Rooba", "Nenu nuvvantu", "Hello rammante inc", "Naloney pongenu",
    "Monna kanipinchavu", "Athey nanne nanne", "Yedane koyyake", "O sukumari",
    "June pothey", "ye chilipi", "Nanne nanne chusthu", "Cheliya cheliya",
    "Pataku pranam", "Kallu moosi", "Enduko Emo", "Manohara",
    "Neekemkavalo Cheppu", "Hrudayam ekkadunnadhi", "New York nagaram", "Oy oy",
    "Chiru chiru"
  ];

  let globalIndex = 1;

  function buildList(containerId, songs) {
    const ul = document.getElementById(containerId);
    songs.forEach(song => {
      const li = document.createElement("li");
      li.className = "song-item";
      li.dataset.number = globalIndex;
      li.dataset.name = song.toLowerCase();

      const num = document.createElement("span");
      num.className = "num";
      num.textContent = globalIndex + ".";

      const a = document.createElement("a");
      a.className = "song-link";
      a.href = "https://www.google.com/search?q=" + encodeURIComponent(song + " song lyrics");
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = song;

      li.appendChild(num);
      li.appendChild(a);
      ul.appendChild(li);

      globalIndex++;
    });
  }

  buildList("list-karthik", karthikSongs);
  buildList("list-harris", harrisSongs);

  const searchBar = document.getElementById("searchBar");
  const allItems = document.querySelectorAll(".song-item");
  const sections = document.querySelectorAll(".section-title");
  const noResults = document.getElementById("noResults");

  searchBar.addEventListener("input", function() {
    const query = this.value.trim().toLowerCase();
    let anyVisible = false;

    allItems.forEach(item => {
      const matches = item.dataset.number === query || item.dataset.name.includes(query) || query === "";
      item.style.display = matches ? "flex" : "none";
      if (matches) anyVisible = true;
    });

    // Hide section headings if all their items are hidden
    document.querySelectorAll(".song-list").forEach(ul => {
      const visibleItems = ul.querySelectorAll('.song-item[style="display: flex;"]');
      const heading = ul.previousElementSibling;
      const hasVisible = Array.from(ul.children).some(li => li.style.display !== "none");
      heading.style.display = hasVisible ? "block" : "none";
      ul.style.display = hasVisible ? "block" : "none";
    });

    noResults.style.display = anyVisible ? "none" : "block";
  });
</script>
</body>
</html>
